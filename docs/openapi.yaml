openapi: 3.1.0
info:
  title: Nanny Services API
  version: 1.0.0
  description: |
    REST API for finding nannies, managing favorites, booking appointments,
    and leaving reviews after completed appointments.
servers:
  - url: https://nanny-services-api.onrender.com/api
    description: Render production
  - url: http://localhost:5000/api
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Uploads
  - name: Nannies
  - name: Appointments
paths:
  /health:
    get:
      tags: [Health]
      summary: Check whether the API server is running
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API is running
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a parent or nanny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User logged in
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out on the client
      description: The client must remove the JWT token after this request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me:
    get:
      tags: [Users]
      summary: Get the current user with available favorite nannies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/avatar:
    patch:
      tags: [Users]
      summary: Update the current user avatar URL
      description: Legacy JSON endpoint for saving an already uploaded avatar URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: uri
                  example: https://example.com/avatar.jpg
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/profile:
    patch:
      tags: [Users]
      summary: Update the current user profile
      description: If the current user is a nanny, changed name and avatar are synchronized to the nanny profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/update-password:
    patch:
      tags: [Users]
      summary: Update the current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  example: StrongPass123!
                newPassword:
                  type: string
                  minLength: 8
                  example: NewStrongPass456!
      responses:
        "200":
          description: Password updated
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/favorites:
    post:
      tags: [Users]
      summary: Toggle a nanny in the current user's favorites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NannyIdRequest"
      responses:
        "200":
          description: Favorites updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /uploads/avatar:
    post:
      tags: [Uploads]
      summary: Upload an avatar image to Cloudinary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "201":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAvatarResponse"
        "400":
          description: Image file is required
        "401":
          $ref: "#/components/responses/Unauthorized"
  /nannies:
    get:
      tags: [Nannies]
      summary: Get completed nanny profiles
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: perPage
          schema:
            type: integer
            minimum: 3
            maximum: 20
            default: 3
        - in: query
          name: region
          description: Case-insensitive region value, for example kyiv oblast.
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            default: a_to_z
            enum: [a_to_z, z_to_a, popular, not_popular, price_asc, price_desc]
        - in: query
          name: filter
          schema:
            type: string
            default: show_all
            enum: [less_than_18, greater_than_18, show_all]
      responses:
        "200":
          description: Paginated nanny profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NanniesPageResponse"
  /nannies/me:
    get:
      tags: [Nannies]
      summary: Get the current nanny profile and reviews
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nanny profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NannyDetailsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Nannies]
      summary: Update the current nanny profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNannyProfileRequest"
      responses:
        "200":
          description: Nanny profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NannyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /nannies/{nannyId}:
    get:
      tags: [Nannies]
      summary: Get a completed nanny profile and reviews
      parameters:
        - $ref: "#/components/parameters/NannyId"
      responses:
        "200":
          description: Nanny details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NannyDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /nannies/{nannyId}/appointments:
    post:
      tags: [Appointments]
      summary: Create an appointment request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NannyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments/my:
    get:
      tags: [Appointments]
      summary: Get appointments created by the current parent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Parent appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments/incoming:
    get:
      tags: [Appointments]
      summary: Get incoming appointments for the current nanny
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Incoming appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments/{appointmentId}/status:
    patch:
      tags: [Appointments]
      summary: Accept or reject a pending appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
      responses:
        "200":
          description: Appointment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments/{appointmentId}/complete:
    patch:
      tags: [Appointments]
      summary: Complete an accepted appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Appointment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments/{appointmentId}/cancel:
    patch:
      tags: [Appointments]
      summary: Cancel a pending or accepted appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments/{appointmentId}/reviews:
    post:
      tags: [Appointments]
      summary: Review a completed appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NannyId:
      in: path
      name: nannyId
      required: true
      schema:
        type: string
      example: 0cef122f685b662efedcab95
    AppointmentId:
      in: path
      name: appointmentId
      required: true
      schema:
        type: string
      example: 6a04f135f348224190b65418
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 3
          example: Oleksandr Sulyma
        email:
          type: string
          format: email
          example: parent@example.com
        password:
          type: string
          minLength: 8
          example: StrongPass123!
        role:
          type: string
          enum: [parent, nanny]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: parent@example.com
        password:
          type: string
          example: StrongPass123!
    User:
      type: object
      properties:
        id:
          type: string
          example: 6a04f0b2f348224190b65417
        name:
          type: string
          example: Oleksandr Sulyma
        email:
          type: string
          format: email
          example: parent@example.com
        avatar:
          type: string
          format: uri
          nullable: true
          example: https://res.cloudinary.com/demo/image/upload/avatar.webp
        role:
          type: string
          enum: [parent, nanny]
        favorites:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/Nanny"
    UserResponse:
      type: object
      properties:
        message:
          type: string
          example: User profile updated successfully
        data:
          $ref: "#/components/schemas/User"
    UpdateUserProfileRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          example: Oleksandr Sulyma
        email:
          type: string
          format: email
          example: parent@example.com
        avatar:
          type: string
          format: uri
          example: https://res.cloudinary.com/demo/image/upload/avatar.webp
    UploadAvatarResponse:
      type: object
      properties:
        message:
          type: string
          example: Avatar uploaded successfully
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
              example: https://res.cloudinary.com/demo/image/upload/avatar.webp
    NannyIdRequest:
      type: object
      required: [nannyId]
      properties:
        nannyId:
          type: string
          example: 0cef122f685b662efedcab95
    UpdateNannyProfileRequest:
      type: object
      properties:
        avatar_url:
          type: string
          format: uri
          example: https://example.com/nanny.jpg
        birthday:
          type: string
          format: date
          example: 1994-04-10
        experience:
          type: string
          example: 6 years
        education:
          type: string
          example: Master's in Early Childhood Development
        kids_age:
          type: string
          example: 2 to 9 years old
        price_per_hour:
          type: number
          exclusiveMinimum: 0
          example: 20
        location:
          $ref: "#/components/schemas/Location"
        about:
          type: string
          example: I provide attentive and reliable childcare.
        characters:
          type: array
          minItems: 1
          items:
            type: string
          example: [attentive, patient, creative]
    Nanny:
      allOf:
        - $ref: "#/components/schemas/UpdateNannyProfileRequest"
        - type: object
          properties:
            id:
              type: string
              example: 0cef122f685b662efedcab95
            userId:
              type: string
              example: 6c10bcf83ee896d956f648dc
            name:
              type: string
              example: Anastasiia Dziuba
            rating:
              type: number
              example: 4.85
            isProfileComplete:
              type: boolean
              example: true
    Review:
      type: object
      properties:
        id:
          type: string
          example: f31f07f3afaf5402fe332b24
        authorId:
          oneOf:
            - type: string
            - type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  example: Olena Petrova
                avatar:
                  type: string
                  nullable: true
        nannyId:
          type: string
          example: 0cef122f685b662efedcab95
        appointmentId:
          type: string
          example: 6a04f135f348224190b65418
        rating:
          type: number
          example: 5
        comment:
          type: string
          example: The nanny was attentive, punctual, and kind.
    NannyDetailsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            nanny:
              $ref: "#/components/schemas/Nanny"
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/Review"
    NannyProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Profile updated successfully
        data:
          $ref: "#/components/schemas/Nanny"
    NanniesPageResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 3
        totalItems:
          type: integer
          example: 12
        totalPages:
          type: integer
          example: 4
        data:
          type: array
          items:
            $ref: "#/components/schemas/Nanny"
    Location:
      type: object
      required: [country, region, settlement]
      properties:
        country:
          type: string
          example: ukraine
        region:
          type: string
          example: kyiv oblast
        settlement:
          type: string
          example: brovary
    CreateAppointmentRequest:
      type: object
      required: [parentName, email, address, phone, childAge, scheduledAt]
      properties:
        parentName:
          type: string
          example: Oleksandr Sulyma
        email:
          type: string
          format: email
          example: parent@example.com
        address:
          type: string
          example: Kyiv, Khreshchatyk Street 12
        phone:
          type: string
          example: "+380671234567"
        childAge:
          type: string
          example: 5 years
        scheduledAt:
          type: string
          format: date-time
          example: "2026-06-15T09:30:00.000Z"
        comment:
          type: string
          example: We would like to arrange a meeting.
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: 6a04f135f348224190b65418
        parentId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/User"
        nannyId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Nanny"
        parentName:
          type: string
          example: Oleksandr Sulyma
        email:
          type: string
          format: email
          example: parent@example.com
        address:
          type: string
          example: Kyiv, Khreshchatyk Street 12
        phone:
          type: string
          example: "+380671234567"
        childAge:
          type: string
          example: 5 years
        scheduledAt:
          type: string
          format: date-time
          example: "2026-06-15T09:30:00.000Z"
        comment:
          type: string
          example: We would like to arrange a meeting.
        status:
          type: string
          enum: [pending, accepted, rejected, completed, cancelled]
        hasReview:
          type: boolean
          description: Present in parent appointment responses.
          example: false
        review:
          nullable: true
          description: Present in incoming nanny appointment responses when a parent has submitted feedback.
          type: object
          properties:
            rating:
              type: number
              example: 5
            comment:
              type: string
              example: The nanny was attentive, punctual, and kind.
    AppointmentResponse:
      type: object
      properties:
        message:
          type: string
          example: Appointment updated successfully
        data:
          $ref: "#/components/schemas/Appointment"
    AppointmentsResponse:
      type: object
      properties:
        message:
          type: string
          example: Your appointments
        data:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
    CreateReviewRequest:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          minLength: 3
          example: The nanny was attentive, punctual, and kind.
    CreateReviewResponse:
      type: object
      properties:
        message:
          type: string
          example: Review created successfully
        data:
          type: object
          properties:
            review:
              $ref: "#/components/schemas/Review"
            nannyRating:
              type: number
              example: 4.85
  responses:
    Unauthorized:
      description: Authentication required or token is invalid
    Forbidden:
      description: The current role is not allowed to perform this action
    NotFound:
      description: Requested resource not found
    Conflict:
      description: Resource already exists
